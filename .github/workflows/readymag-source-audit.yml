name: Inspect original Readymag homepage geometry
on:
  push:
    branches: [fix/readymag-accurate-home-20261113]
    paths: [.github/workflows/readymag-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Record source page elements with actual pixels and computed styles
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, os
          os.makedirs('source-geometry',exist_ok=True)
          js=r"""() => {
             const rect=(el)=>{let r=el.getBoundingClientRect();return {x:+r.x.toFixed(1),y:+(r.y+scrollY).toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1)}};
             const describe=(el)=>{
               const c=getComputedStyle(el);
               const text=(el.innerText||el.textContent||'').replace(/\\s+/g,' ').trim().slice(0,200);
               const image=el.matches('img')?el:el.querySelector('img');
               const a=el.matches('a')?el:el.closest('a')||el.querySelector('a');
               const txt=el.matches('p,h1,h2,h3,h4,span')?el:el.querySelector('p,h1,h2,h3,h4,span');
               const tstyle=getComputedStyle(txt||el);
               return {rect:rect(el),id:el.id,classes:typeof el.className==='string'?el.className.slice(0,150):'',display:c.display,visibility:c.visibility,opacity:c.opacity,position:c.position,transform:c.transform,background:c.backgroundColor,backgroundImage:c.backgroundImage.slice(0,95),borderRadius:c.borderRadius,overflow:c.overflow,
                 text, font:tstyle.fontFamily,size:tstyle.fontSize,weight:tstyle.fontWeight,lineHeight:tstyle.lineHeight,color:tstyle.color,letter:tstyle.letterSpacing,
                 image:image?{src:image.currentSrc||image.src,rect:rect(image),width:image.naturalWidth,height:image.naturalHeight,fit:getComputedStyle(image).objectFit}:null,
                 link:a?.href||null,widgetType:el.getAttribute('data-type')||'',
                 parent:el.parentElement?{className:String(el.parentElement.className).slice(0,80),rect:rect(el.parentElement)}:null};
             };
             const widgets=[...document.querySelectorAll('.rmwidget')];
             const chosen=widgets.length?widgets:[...document.querySelectorAll('h1,h2,h3,h4,p,img')];
             const items=chosen.map(describe).filter(d=>d.rect.w>2&&d.rect.h>2);
             const textWidgets=items.filter(d=>d.text.length>0);
             const images=items.filter(d=>d.image);
             return {url:location.href,viewport:innerWidth,height:innerHeight,document:{w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight},bodyBg:getComputedStyle(document.body).backgroundColor,widgets:items.length,all:items.slice(0,150),textWidgets:textWidgets.length,images:images.length};
          }""";
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for width in (390,1440):
                  ctx=browser.new_context(viewport={'width':width,'height':900},device_scale_factor=1)
                  page=ctx.new_page()
                  errs=[]
                  page.on('pageerror',lambda e:errs.append(str(e)))
                  page.goto('https://readymag.website/u3341020794/3666146/',wait_until='domcontentloaded',timeout=65000)
                  page.wait_for_timeout(3800)
                  page.evaluate('() => document.fonts.ready')
                  out=page.evaluate(js)
                  detail=page.evaluate(r"""() => {
                    const r=e=>{const b=e.getBoundingClientRect();return [Math.round(b.x),Math.round(b.y+scrollY),Math.round(b.width),Math.round(b.height)]};
                    const format=e=>{const c=getComputedStyle(e);return {tag:e.tagName,cls:String(e.className).slice(0,90),r:r(e),text:(e.innerText||'').slice(0,90).replace(/\\s+/g,' '),size:c.fontSize,line:c.lineHeight,font:c.fontFamily,weight:c.fontWeight,color:c.color,bg:c.backgroundColor,radius:c.borderRadius,pad:c.padding,margin:c.margin,opacity:c.opacity,display:c.display,transform:c.transform}};
                    const widgets=[...document.querySelectorAll('.rmwidget.widget-text-v3')].filter(e=>/beeline family|alfaforex|equilibrium|stforex|Hi, i'm Roman/.test(e.innerText));
                    const buttons=[...document.querySelectorAll('.rmwidget.widget-button')].slice(0,2);
                    const images=[...document.querySelectorAll('.rmwidget.widget-picture')].slice(0,8);
                    const parentChain=e=>{const a=[];for(let i=0;e&&i<8;i++,e=e.parentElement)a.push({tag:e.tagName,cls:String(e.className).slice(0,100),r:r(e),scroll:e.scrollHeight,client:e.clientHeight,overflow:getComputedStyle(e).overflow,transform:getComputedStyle(e).transform});return a};
                    const scrollers=[...document.querySelectorAll('*')].filter(e=>e.scrollHeight>e.clientHeight+300&&e.clientHeight>100).slice(0,15).map(e=>({tag:e.tagName,cls:String(e.className).slice(0,120),r:r(e),scroll:e.scrollHeight,client:e.clientHeight,top:e.scrollTop,overflow:getComputedStyle(e).overflow}));
                    return {texts:widgets.map(e=>({outer:format(e),inner:[...e.querySelectorAll('h1,h2,h3,h4,p,span,a')].slice(0,15).map(format)})),buttons:buttons.map(e=>({outer:format(e),inner:[...e.querySelectorAll('*')].slice(0,7).map(format)})),images:images.map(e=>format(e)),scrollers,chain:parentChain(widgets[0])};
                  }""")
                  print('SOURCE_DETAIL',width,json.dumps(detail,ensure_ascii=False),flush=True)
                  page.mouse.wheel(0,1200)
                  page.wait_for_timeout(900)
                  scroll=page.evaluate("""() => ({win:scrollY,docH:document.documentElement.scrollHeight,scrollers:[...document.querySelectorAll('*')].filter(e=>e.scrollTop>100).slice(0,8).map(e=>({className:String(e.className).slice(0,80),scrollTop:e.scrollTop})),hero:document.querySelector('.rmwidget.widget-text-v3')?.getBoundingClientRect().y})""")
                  print('SOURCE_SCROLL',width,json.dumps(scroll,ensure_ascii=False),flush=True)
                  out['errors']=errs[:7]
                  print('SOURCE_LAYOUT',width,json.dumps({k:v for k,v in out.items() if k!='all'},ensure_ascii=False),flush=True)
                  for i,item in enumerate(out['all']):
                      print('SOURCE_WIDGET',width,i,json.dumps(item,ensure_ascii=False),flush=True)
                  with open(f'source-geometry/source-{width}.json','w') as f:json.dump(out,f,ensure_ascii=False,indent=2)
                  page.screenshot(path=f'source-geometry/readymag-{width}.png',full_page=True,animations='disabled',timeout=40000)
                  ctx.close()
              browser.close()
          PY
      - name: Probe original Readymag hover interactions
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox'])
            c=b.new_context(viewport={'width':1440,'height':900})
            page=c.new_page()
            page.goto('https://readymag.website/u3341020794/3666146/',wait_until='domcontentloaded',timeout=60000)
            page.wait_for_timeout(3000)
            js="""() => {
              const pic=document.querySelector('.rmwidget.widget-picture');
              const pill=document.querySelector('.rmwidget.widget-button');
              const group=e=>[e,...e.querySelectorAll('*')].slice(0,9).map(n=>{const c=getComputedStyle(n);return {tag:n.tagName,cls:String(n.className).slice(0,70),hover:n.matches(':hover'),opacity:c.opacity,filter:c.filter,transform:c.transform,scale:c.scale,transition:c.transition,animation:c.animation,background:c.backgroundColor,shadow:c.boxShadow,radius:c.borderRadius}});
              return {picture:group(pic),tag:group(pill)};
            }""";
            def snapshot(name):print('HOVER_PROBE',name,json.dumps(page.evaluate(js),ensure_ascii=False),flush=True)
            page.mouse.move(120,380)
            snapshot('base')
            page.mouse.move(220,490)
            page.wait_for_timeout(650)
            snapshot('image')
            page.mouse.move(875,642)
            page.wait_for_timeout(450)
            snapshot('pill')
            c.close();b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readymag-source-geometry
          path: source-geometry/
