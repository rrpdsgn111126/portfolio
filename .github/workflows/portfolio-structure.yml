name: Verify portfolio structure
on:
  push:
    paths:
      - 'index.html'
      - 'home.css'
      - 'scripts/import-home-assets.mjs'
      - 'styles.css'
      - 'shared/**'
      - 'cases/**'
      - 'scripts/verify-portfolio-structure.mjs'
      - '.github/workflows/portfolio-structure.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-portfolio-structure.mjs
      - run: git diff --check
