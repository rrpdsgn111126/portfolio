name: Import original homepage images (staging branch)
on:
  push:
    branches:
      - feature/readymag-home-20261113
    paths:
      - scripts/import-home-assets.mjs
permissions:
  contents: write
concurrency:
  group: readymag-source-image-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/import-home-assets.mjs
      - run: node scripts/import-home-assets.mjs
      - name: Commit original images to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/home/beeline-family-01.webp assets/home/beeline-family-02.webp assets/home/beeline-family-03.webp assets/home/beeline-family-04.webp assets/home/alfaforex-01.webp assets/home/alfaforex-02.webp assets/home/equilibrium-01.webp assets/home/stforex-01.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve original Readymag portfolio artwork"
          git pull --rebase origin feature/readymag-home-20261113
          git push origin HEAD:feature/readymag-home-20261113
