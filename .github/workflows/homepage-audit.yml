name: Portfolio homepage browser audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'home.css'
      - 'home-interactions.js'
      - 'assets/home/**'
      - 'shared/**'
      - '.github/workflows/homepage-audit.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'home.css'
      - 'home-interactions.js'
      - 'assets/home/**'
      - 'shared/**'
      - '.github/workflows/homepage-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Launch static website
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-home-http.log 2>&1 &
          sleep 2
      - name: Verify precise homepage geometry and six viewport layouts
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          out=Path('homepage-audit');out.mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for width in (375,390,430,1280,1440,1920):
                  ctx=browser.new_context(viewport={'width':width,'height':900},device_scale_factor=1)
                  page=ctx.new_page()
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.on('response',lambda r:errors.append('HTTP '+str(r.status)+' '+r.url) if r.status>=400 and r.url.startswith('http://127.0.0.1:4173') else None)
                  page.goto('http://127.0.0.1:4173/',wait_until='networkidle',timeout=30000)
                  page.evaluate('() => document.fonts.ready')
                  assert page.title()=='Roman Khokhlov — Portfolio'
                  assert page.locator('.home-project').count()==4,('project count',width)
                  assert page.locator('.home-project__shot').count()==8,('screenshots',width)
                  assert page.locator('.home-archive').count()==0
                  assert page.locator('#stforex').count()==0
                  assert page.locator('.home-project__arrow').count()==0
                  assert page.locator('#finam a[href="/cases/finam/"]').count()==1
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),('horizontal overflow',width)
                  assert page.evaluate("getComputedStyle(document.body).backgroundColor")=='rgb(249, 249, 250)'
                  images=page.locator('.home-project__shot')
                  for image in images.all():
                      image.evaluate("(e)=>e.loading='eager'")
                      image.scroll_into_view_if_needed()
                  page.wait_for_function("() => [...document.querySelectorAll('.home-project__shot')].every(x=>x.complete && x.naturalWidth>0)",timeout=25000)
                  page.wait_for_timeout(550)
                  assert not errors,('errors',width,errors)
                  data=page.evaluate("""() => {
                    const rect=e=>{const b=e.getBoundingClientRect();return {x:b.x,y:b.y+scrollY,w:b.width,h:b.height}};
                    return {title:rect(document.querySelector('#home-title')),lead:rect(document.querySelector('.home-intro p')),
                      cards:[...document.querySelectorAll('.home-project')].map(e=>({rect:rect(e),copy:rect(e.querySelector('.home-project__copy')),title:rect(e.querySelector('h2')),
                        images:[...e.querySelectorAll('img')].map(rect),bg:getComputedStyle(e).backgroundColor,
                        font:getComputedStyle(e.querySelector('h2')).fontFamily,weight:getComputedStyle(e.querySelector('h2')).fontWeight,
                        size:getComputedStyle(e.querySelector('h2')).fontSize,
                        descSize:getComputedStyle(e.querySelector('p')).fontSize}))};
                  }""")
                  if width==1440:
                      assert abs(data['title']['x']-86)<1 and abs(data['title']['y']-72)<1,('intro',data)
                      assert abs(data['title']['h']-120)<2,('title height',data['title'])
                      assert abs(data['lead']['x']-86)<1 and abs(data['lead']['y']-218)<2,('lead',data['lead'])
                      cards=data['cards']
                      for idx,expected in enumerate((426,804,1184,1564)):
                          box=cards[idx]['rect']
                          assert abs(box['x']-86)<1 and abs(box['y']-expected)<3 and abs(box['w']-1268)<1 and abs(box['h']-328)<1,('card',idx,box)
                          assert cards[idx]['size']=='18px' and cards[idx]['weight']=='700'
                          assert cards[idx]['bg']=='rgb(232, 235, 241)'
                      for i,(x,y) in enumerate([(193,470),(402,495),(941,850),(732,875),(193,1236),(402,1280)]):
                          img=cards[i//2]['images'][i%2]
                          assert abs(img['x']-x)<2 and abs(img['y']-y)<3,('image placement',i,img,x,y)
                      print('READYMAG_DESKTOP_GEOMETRY_MATCH_1440',json.dumps(data),flush=True)
                  if width<=430:
                      assert all(c['rect']['w']<=width-30 for c in data['cards']),(width,data)
                  # Normalize scroll before comparing viewport-relative bounding boxes.
                  page.evaluate('window.scrollTo(0,0)')
                  page.wait_for_timeout(120)
                  # Shared Finam inspector must be inert without ?debug=blocks.
                  assert page.locator('#block-debug-overlay').count()==0,('overlay leaked into normal mode',width)
                  # Inspect mode uses the same no-layout-change overlay as the Finam case.
                  debug=ctx.new_page()
                  debug_errors=[]
                  debug.on('pageerror',lambda error:debug_errors.append(str(error)))
                  debug.goto('http://127.0.0.1:4173/?debug=blocks',wait_until='networkidle',timeout=30000)
                  assert debug.locator('#block-debug-overlay').count()==1,('missing inspector',width)
                  assert debug.locator('#block-debug-overlay .block-debug-label').count()==37,('wrong block labels',width)
                  for selector in ('#home-intro','#home-title','#home-description','#home-work',
                                   '#beeline-family-media','#beeline-family-image-1','#beeline-family-image-2',
                                   '#beeline-family-copy','#beeline-family-title','#beeline-family-description','#beeline-family-tags',
                                   '#finam-media','#finam-image-1','#finam-image-2','#finam-tags'):
                      assert debug.locator(selector).count()==1,(width,'missing debug ID',selector)
                      assert debug.locator('.block-debug-label',has_text=selector).count()>=1,(width,'missing label',selector)
                  # IDs and overlay must not disturb original geometry, overflow or page content.
                  for selector in ('#home-title','#beeline-family','#alfaforex','#equilibrium','#finam'):
                      normal=page.locator(selector).bounding_box()
                      marked=debug.locator(selector).bounding_box()
                      assert normal and marked,(width,'missing geometry',selector)
                      for key in ('x','y','width','height'):
                          assert abs(normal[key]-marked[key])<1,(width,selector,key,normal,marked)
                  assert debug.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),('debug overflow',width)
                  # Clicking a named overlay copies its ID and must not open the case link.
                  if width==1440:
                      target=debug.locator('.block-debug-label',has_text='#beeline-family-image-1')
                      target.click(force=True)
                      debug.wait_for_timeout(120)
                      assert debug.url.endswith('/?debug=blocks'),('inspector navigated unexpectedly',debug.url)
                      assert 'beeline-family-image-1' in debug.locator('#block-debug-toast').inner_text(),('copy feedback missing',width)
                  if width in (390,1440):
                      debug.screenshot(path=str(out/f'homepage-debug-{width}.png'),full_page=True,animations='disabled')
                  assert not debug_errors,(width,debug_errors)
                  debug.close()
                  page.evaluate('window.scrollTo(0,0)')
                  page.wait_for_timeout(150)
                  page.screenshot(path=str(out/f'homepage-{width}.png'),full_page=True,animations='disabled',timeout=30000)
                  page.locator('#finam a').click()
                  assert page.url.endswith('/cases/finam/')
                  assert page.title()=='Finam — Roman Khokhlov'
                  assert page.locator('#components-carousel .components-slide').count()==3
                  assert page.locator('#portfolio-home-link').get_attribute('href')=='/'
                  page.go_back(wait_until='domcontentloaded')
                  assert page.title()=='Roman Khokhlov — Portfolio'
                  assert not errors,('navigation',width,errors)
                  print('PORTFOLIO_BROWSER_OK',width,flush=True)
                  ctx.close()
              # Original Readymag uses an internal scroll wrapper; capture three viewport slices.
              for width in (390,1440):
                  ctx=browser.new_context(viewport={'width':width,'height':900})
                  page=ctx.new_page()
                  try:
                      page.goto('https://readymag.website/u3341020794/3666146/',wait_until='domcontentloaded',timeout=45000)
                      page.wait_for_timeout(2000)
                      for offset in (0,650,1080):
                          page.evaluate('(scroll)=>{const sc=document.querySelector(".content-scroll-wrapper");if(sc)sc.scrollTop=scroll;}',offset)
                          page.wait_for_timeout(350)
                          page.screenshot(path=str(out/f'readymag-{width}-scroll-{offset}.png'),animations='disabled',timeout=25000)
                      print('REFERENCE_CAPTURE_OK',width,flush=True)
                  except Exception as error:
                      print('REFERENCE_CAPTURE_UNAVAILABLE',width,str(error)[:270],flush=True)
                  ctx.close()
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-readymag-comparison
          path: homepage-audit/
          if-no-files-found: warn
